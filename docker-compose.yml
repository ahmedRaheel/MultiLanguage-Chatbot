services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3

    command:
      - start-dev
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

      KC_BOOTSTRAP_ADMIN_USERNAME: keycloakadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak:/opt/keycloak/data/import

    networks:
      - chatbot-network

networks:
  chatbot-network:
    external: true